<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAWON TV</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        video { width: 100vw; height: 100vh; object-fit: contain; }
        
        /* ডিশ লাইনের মতো স্ক্রিনের কোণায় চ্যানেল নম্বর ও নাম দেখানোর স্টাইল */
        #osd {
            position: fixed; 
            top: 40px; 
            right: 40px;
            background: rgba(0, 0, 0, 0.85); 
            color: #00ffcc;
            padding: 15px 30px; 
            font-size: 28px; 
            font-weight: bold;
            font-family: sans-serif; 
            border-left: 5px solid #00ffcc;
            border-radius: 8px; 
            display: none; 
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
    </style>
    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <div id="osd">CH 1</div>
    <video id="video" autoplay controls></video>

    <script>
        let channels = [];
        let currentIndex = 0;
        let typedNum = "";
        let numTimer = null;
        const video = document.getElementById('video');
        const osd = document.getElementById('osd');
        let hls = new Hls();

        // সঠিক লিঙ্কটি এখানে বসানো হলো
        const m3uUrl = "https://raw.githubusercontent.com/alizshawon1-cmyk/trut-tv/refs/heads/main/Ap"; 

        // স্বয়ংক্রিয়ভাবে M3U ফাইল ফেচ করে চ্যানেল লিস্ট তৈরি করা
        async function loadChannels() {
            try {
                let response = await fetch(m3uUrl);
                let data = await response.text();
                parseM3U(data);
            } catch (error) {
                console.error("M3U Load Error:", error);
                showOSD("Failed to load channels");
            }
        }

        // M3U টেক্সট পার্স করে চ্যানেলের অ্যারে বানানো
        function parseM3U(data) {
            let lines = data.split('\n');
            let currentName = "Channel";

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let parts = line.split(',');
                    if (parts.length > 1) {
                        currentName = parts[parts.length - 1].trim();
                    }
                } else if (line && !line.startsWith('#')) {
                    channels.push({
                        number: channels.length + 1,
                        name: currentName,
                        url: line
                    });
                    currentName = "Channel";
                }
            }

            if (channels.length > 0) {
                playChannel(0);
                loadChannelsListOnStart(); // লোড সম্পন্ন হওয়ার নোটিফিকেশন
            } else {
                showOSD("No Channels Found");
            }
        }

        function loadChannelsListOnStart() {
            showOSD(`${channels.length} Channels Loaded`);
        }

        // চ্যানেল প্লে করার ফাংশন
        function playChannel(index) {
            if (index < 0 || index >= channels.length) return;
            currentIndex = index;
            let ch = channels[currentIndex];

            showOSD(`CH ${ch.number} - ${ch.name}`);

            if (Hls.isSupported()) {
                hls.destroy();
                hls = new Hls();
                hls.loadSource(ch.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.play();
            }
        }

        // OSD স্ক্রিন মেসেজ দেখানো
        function showOSD(text) {
            osd.innerText = text;
            osd.style.display = 'block';
            clearTimeout(window.osdTimer);
            window.osdTimer = setTimeout(() => { 
                osd.style.display = 'none'; 
            }, 3000);
        }

        // টিভি রিমোটের আপ/ডাউন এবং নাম্বার বাটন হ্যান্ডলার
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.keyCode === 38) {
                currentIndex = (currentIndex - 1 + channels.length) % channels.length;
                playChannel(currentIndex);
                e.preventDefault();
            } else if (e.key === 'ArrowDown' || e.keyCode === 40) {
                currentIndex = (currentIndex + 1) % channels.length;
                playChannel(currentIndex);
                e.preventDefault();
            } else if (e.key >= '0' && e.key <= '9') {
                typedNum += e.key;
                showOSD(`CH ${typedNum}`);

                clearTimeout(numTimer);
                numTimer = setTimeout(() => {
                    let targetNum = parseInt(typedNum);
                    let targetIndex = channels.findIndex(c => c.number === targetNum);
                    if (targetIndex !== -1) {
                        playChannel(targetIndex);
                    } else {
                        showOSD("Channel Not Found");
                    }
                    typedNum = "";
                }, 1200);
                e.preventDefault();
            }
        });

        // প্রোগ্রাম চালু হওয়ার সাথে সাথেই চ্যানেল লোড শুরু হবে
        loadChannels();
    </script>
</body>
</html>
