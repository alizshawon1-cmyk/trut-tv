<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAWON TV</title>
    <!-- Hls.js লাইব্রেরি m3u8 স্ট্রিম স্মুথ প্লে করার জন্য -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #000; color: #fff; margin: 0; font-family: sans-serif; overflow: hidden; }
        #video-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; background: #000; }
        #channel-info { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            background: rgba(0, 0, 0, 0.8); 
            padding: 12px 24px; 
            font-size: 24px; 
            font-weight: bold;
            border-radius: 8px; 
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="channel-info">Loading Channels...</div>
    <div id="video-container">
        <video id="video" autoplay controls></video>
    </div>

    <script>
        // গিটহাবের র-ফাইল লিংক
        const m3uUrl = "https://raw.githubusercontent.com/alizshawon1-cmyk/trut-tv/refs/heads/main/Ap";
        let channels = [];
        let currentIndex = 0;
        const video = document.getElementById('video');
        const info = document.getElementById('channel-info');
        let hls;

        async function loadPlaylist() {
            try {
                // CORS বাইপাস করতে corsproxy বা সরাসরি ফেচ ব্যবহার করা
                const response = await fetch(m3uUrl);
                const data = await response.text();
                parseM3U(data);
            } catch (e) {
                info.innerText = "Failed to load playlist! Check Connection.";
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            let currentChannel = {};
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    let nameMatch = line.split(',');
                    currentChannel.name = nameMatch[1] ? nameMatch[1].trim() : "Channel " + (channels.length + 1);
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = {};
                }
            }
            if (channels.length > 0) {
                playChannel(0);
            } else {
                info.innerText = "No Channels Found in Playlist!";
            }
        }

        function playChannel(index) {
            if (index < 0) index = channels.length - 1;
            if (index >= channels.length) index = 0;
            currentIndex = index;
            
            let ch = channels[currentIndex];
            info.innerText = `${currentIndex + 1}. ${ch.name}`;
            
            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(ch.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { 
                    video.play().catch(err => console.log("Autoplay blocked:", err)); 
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    console.error("HLS Error:", data);
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.addEventListener('loadedmetadata', () => { video.play(); });
            }
        }

        // TV Remote Control Support (Up/Down keys & Channel Up/Down)
        window.addEventListener('keydown', (e) => {
            if (e.keyCode === 38 || e.keyCode === 33) { // Up / Channel Up
                playChannel(currentIndex - 1);
                e.preventDefault();
            } else if (e.keyCode === 40 || e.keyCode === 34) { // Down / Channel Down
                playChannel(currentIndex + 1);
                e.preventDefault();
            }
        });

        loadPlaylist();
    </script>
</body>
</html>
