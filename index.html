<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAWON TV</title>
    <!-- Hls.js লাইব্রেরি m3u8 স্ট্রিম স্মুথ প্লে করার জন্য -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #000; color: #fff; margin: 0; font-family: sans-serif; overflow: hidden; }
        #video-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; background: #000; }
        #channel-info { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            background: rgba(0, 0, 0, 0.85); 
            padding: 12px 24px; 
            font-size: 24px; 
            font-weight: bold;
            border-radius: 8px; 
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="channel-info">চ্যানেল লোড হচ্ছে...</div>
    <div id="video-container">
        <video id="video" autoplay controls></video>
    </div>

    <script>
        const m3uUrl = "https://raw.githubusercontent.com/alizshawon1-cmyk/trut-tv/refs/heads/main/Ap";
        let channels = [];
        let currentIndex = 0;
        const video = document.getElementById('video');
        const info = document.getElementById('channel-info');
        let hls;

        async function loadPlaylist() {
            try {
                const response = await fetch(m3uUrl + "?t=" + new Date().getTime()); // ক্যাশ এড়াতে টাইমস্ট্যাম্প যোগ করা হলো
                const data = await response.text();
                parseM3U(data);
            } catch (e) {
                info.innerText = "প্লেলিস্ট লোড করতে ব্যর্থ! ইন্টারনেট কানেকশন চেক করুন।";
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            let currentName = "";
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].replace(/\r/g, "").trim();
                if (!line) continue;

                if (line.startsWith('#EXTINF')) {
                    let commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1 && commaIndex < line.length - 1) {
                        currentName = line.substring(commaIndex + 1).trim();
                        // যদি নামের ভেতরে অতিরিক্ত কোটেশন থাকে তা পরিষ্কার করা
                        if (currentName.includes('"')) {
                            currentName = currentName.replace(/.*"/, "").trim();
                        }
                    }
                } else if (!line.startsWith('#')) {
                    if (!currentName) {
                        currentName = "Channel " + (channels.length + 1);
                    }
                    let cleanUrl = line.split(/\s+/)[0].trim();
                    channels.push({ name: currentName, url: cleanUrl });
                    currentName = ""; // পরের চ্যানেলের জন্য রিসেট
                }
            }

            if (channels.length > 0) {
                playChannel(0);
            } else {
                info.innerText = "ফাইলে কোনো চ্যানেল পাওয়া যায়নি!";
            }
        }

        function playChannel(index) {
            if (channels.length === 0) return;
            if (index < 0) index = channels.length - 1;
            if (index >= channels.length) index = 0;
            currentIndex = index;
            
            let ch = channels[currentIndex];
            info.innerText = `${currentIndex + 1}/${channels.length}. ${ch.name}`;
            
            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls();
                hls.loadSource(ch.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { 
                    video.play().catch(err => console.log("অটোপ্লে ব্লকড:", err)); 
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    console.error("HLS এরর:", data);
                    if (data.fatal) {
                        info.innerText = `${ch.name} - স্ট্রিম এরর! পরবর্তী চ্যানেলে যান।`;
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.addEventListener('loadedmetadata', () => { video.play(); });
            }
        }

        // টিভি রিমোট এবং কিবোর্ডের নেভিগেশন কন্ট্রোল (Up / Down / Channel Up / Channel Down)
        window.addEventListener('keydown', (e) => {
            let keyCode = e.keyCode || e.which;
            if (keyCode === 38 || keyCode === 33 || keyCode === 19) { // Up / PageUp / KeyCode 19
                playChannel(currentIndex - 1);
                e.preventDefault();
            } else if (keyCode === 40 || keyCode === 34 || keyCode === 20) { // Down / PageDown / KeyCode 20
                playChannel(currentIndex + 1);
                e.preventDefault();
            }
        });

        loadPlaylist();
    </script>
</body>
</html>
